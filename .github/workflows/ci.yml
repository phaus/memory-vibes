name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.config.os }}
    name: build (${{ matrix.config.os }}, ${{ matrix.config.label }}, ${{ matrix.config.cmake_args }}, ${{ matrix.config.target }}, ${{ matrix.config.build_test }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # Ubuntu base config
          - { os: ubuntu-latest, label: ubuntu-x86_64, cmake_args: "", target: "mem_band", build_test: false }
          # Linux extra configs
          - { os: ubuntu-latest, label: linux-x86_64-simd, cmake_args: "-DENABLE_SIMD=ON", target: "mem_band", build_test: false }
          - { os: ubuntu-latest, label: linux-arm32, cmake_args: "-DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ -DBUILD_TESTING=OFF -DCHECK_FEATURES=OFF", target: "arm-linux-gnueabihf-gcc", build_test: false }
          - { os: ubuntu-latest, label: linux-arm64, cmake_args: "-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DBUILD_TESTING=OFF -DCHECK_FEATURES=OFF", target: "aarch64-linux-gnu-gcc", build_test: false }
          - { os: ubuntu-latest, label: linux-i386, cmake_args: "-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DBUILD_TESTING=OFF -DCHECK_FEATURES=OFF", target: "i686", build_test: false }
          # macOS extra configs
          - { os: macos-latest, label: macos-x86_64, cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64", target: "x86_64", build_test: false }
          - { os: macos-latest, label: macos-arm64, cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64", target: "arm64", build_test: false }
          # Windows configs — disable testing to avoid GoogleTest fetch failure
          - { os: windows-latest, label: windows-x64, cmake_args: "-DBUILD_TESTING=OFF -G \"Visual Studio 17 2022\" -A x64", target: "mem_band.exe", build_test: false }
          - { os: windows-latest, label: windows-x86, cmake_args: "-DBUILD_TESTING=OFF -G \"Visual Studio 17 2022\" -A Win32", target: "mem_band.exe", build_test: false }
          - { os: windows-latest, label: windows-x64-simd, cmake_args: "-DBUILD_TESTING=OFF -G \"Visual Studio 17 2022\" -A x64 -DENABLE_SIMD=ON", target: "mem_band.exe", build_test: false }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilers (ARM)
        if: contains(matrix.config.label, 'arm')
        run: |
          sudo apt-get update
          if [[ "${{ matrix.config.label }}" == *"arm32"* ]]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          elif [[ "${{ matrix.config.label }}" == *"arm64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install 32-bit libs (i386)
        if: contains(matrix.config.label, 'i386')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          cmake_args="${{ matrix.config.cmake_args }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            cmake_args="$cmake_args -DCMAKE_BUILD_TYPE=Release"
          fi
          cmake -S . -B build $cmake_args
          cmake --build build --config Release
        shell: bash

      - name: Run Tests
        if: matrix.config.build_test != false
        run: |
          ctest --output-on-failure
        shell: bash