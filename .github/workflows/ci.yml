name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Linux extra configs
          - { os: ubuntu-latest, build_type: Release, simd: ON }
          - { os: ubuntu-latest, cmake_args: "-DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++", target: linux-arm32 }
          - { os: ubuntu-latest, cmake_args: "-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++", target: linux-arm64 }
          - { os: ubuntu-latest, cmake_args: "-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32", target: linux-i386 }
          - { os: ubuntu-latest, cmake_args: "", target: mem_band, build_test: false }
          - { os: macos-latest, cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64", target: macos-x86_64 }
          - { os: macos-latest, cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64", target: macos-arm64 }
          # Windows configs — disable testing to avoid GoogleTest fetch failure
          - { os: windows-latest, cmake_args: "-DBUILD_TESTING=OFF -G \"Visual Studio 17 2022\" -A x64", target: windows-x64 }
          - { os: windows-latest, cmake_args: "-DBUILD_TESTING=OFF -G \"Visual Studio 17 2022\" -A Win32", target: windows-x86 }
          - { os: windows-latest, cmake_args: "-DBUILD_TESTING=OFF -G \"Visual Studio 17 2022\" -A x64 -DENABLE_SIMD=ON", target: windows-x64-simd }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        run: |
          cmake -S . -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Release' }}
          cmake --build build --config ${{ matrix.build_type || 'Release' }}
        shell: bash

      - name: Run Tests
        if: matrix.build_test != false
        run: |
          ctest --output-on-failure
        shell: bash